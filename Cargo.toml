[package]
name = "groq-minifier"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
description = "A standalone, spelling-preserving GROQ whitespace and comment minifier"
license = "MIT"
repository = "https://github.com/josemanosalvas/groq-minifier"
readme = "README.md"
keywords = ["groq", "minifier", "wasm"]
categories = ["text-processing", "wasm"]
include = ["/src/**", "/tests/**", "/fixtures/**", "/examples/**", "/benches/**", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE", "/THIRD_PARTY_NOTICES"]

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = []
wasm = ["dep:wasm-bindgen"]

[dependencies]
wasm-bindgen = { version = "=0.2.105", optional = true }

[dev-dependencies]
serde_json = "=1.0.145"
proptest = "=1.8.0"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
panic = "abort"
strip = "debuginfo"

[[bench]]
name = "scanner"
harness = false
